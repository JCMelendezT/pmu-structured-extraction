$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: sirena_evaluar_modelo
display_name: Evaluar modelo SIRENA
version: 1
type: command

description: >-
  Corre el harness de evaluacion contra el corpus gold y deja metricas.json,
  informe.md y las metricas en MLflow. La clave de Groq la resuelve el propio
  proceso: no viaja por el comando.

inputs:
  corpus:
    type: uri_folder
  modelo:
    type: string
    default: openai/gpt-oss-20b
  limite:
    type: integer
    default: 340
  autor:
    type: string
    default: sirena
  rama:
    type: string
    default: ""
  key_vault_url:
    type: string

outputs:
  resultados:
    type: uri_folder

code: ../..
environment: azureml:sirena-eval@latest

# environment_variables se movio a pipeline.yml (nivel de job). El esquema de
# command component no tiene clave environment_variables: Azure la descarta en
# silencio al registrar. Sin KEY_VAULT_URL el job no sabe donde esta el Key
# Vault y falla con "No hay clave de Groq". Sin INFERENCE_MODELO ambos pasos
# evaluarian el 20b y la comparacion saldria sin sentido. Ver pipeline.yml.

command: >-
  export PYTHONPATH=backend/inference:common/sirena-schema &&
  python azureml/src/evaluar.py
  --corpus ${{inputs.corpus}}/gold_v1/eval.jsonl
  --limite ${{inputs.limite}}
  --salida ${{outputs.resultados}}
  --autor ${{inputs.autor}}
  --rama ${{inputs.rama}}
