$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: sirena_registrar_configuracion
display_name: Registrar configuracion ganadora
version: 1
type: command

description: >-
  Registra la configuracion ganadora en el registro de modelos del workspace
  como sirena-extractor, con la ontologia, la decision, los hashes de los
  prompts y el informe del ganador como artefactos, y los tags que exige el
  plan.

inputs:
  # decision.json por un lado y los dos resultados por el otro: la decision
  # dice quien gano, pero el informe del ganador vive en la carpeta de
  # resultados de ese modelo, y comparar.py no copia los informes.
  decision:
    type: uri_folder
  resultados_a:
    type: uri_folder
  resultados_b:
    type: uri_folder
  # El MLClient no deduce el workspace dentro de un job: los defaults del CLI
  # viven en la maquina que submits, no en el contenedor. Van explicitos.
  subscription_id:
    type: string
  resource_group:
    type: string
  workspace:
    type: string

outputs:
  modelo_registrado:
    type: uri_folder

code: ../..
environment: azureml:sirena-eval@latest

environment_variables:
  # Registrar en el registro de modelos es una escritura en Azure, asi que
  # DefaultAzureCredential tiene que usar la identidad administrada. El permiso
  # va aparte, en el ticket de roles.
  AZURE_TOKEN_CREDENTIALS: ManagedIdentityCredential

# La identidad administrada se declara en el pipeline, en el job registrar: el
# esquema del command component no tiene clave identity. Registrar.py importa
# inference.prompts para hashear los prompts, de ahi el PYTHONPATH.
command: >-
  export PYTHONPATH=backend/inference:common/sirena-schema &&
  python azureml/src/registrar.py
  --decision ${{inputs.decision}}/decision.json
  --resultados-a ${{inputs.resultados_a}}
  --resultados-b ${{inputs.resultados_b}}
  --salida ${{outputs.modelo_registrado}}
  --subscription-id ${{inputs.subscription_id}}
  --resource-group ${{inputs.resource_group}}
  --workspace ${{inputs.workspace}}
