$schema: https://azuremlschemas.azureedge.net/latest/commandComponent.schema.json
name: sirena_registrar_configuracion
display_name: Registrar configuracion ganadora
version: 1
type: command

description: >-
  Registra la configuracion ganadora en el registro de modelos del workspace
  como sirena-extractor, con la ontologia y los hashes de prompts como
  artefactos, y los tags que exige el plan.

inputs:
  decision:
    type: uri_folder
  key_vault_url:
    type: string

outputs:
  modelo_registrado:
    type: uri_folder

code: ../..
environment: azureml:sirena-eval@latest

environment_variables:
  # Registrar en el registro de modelos es una escritura en Azure, asi que
  # necesita identidad propia. El permiso va aparte, en el ticket de roles.
  AZURE_TOKEN_CREDENTIALS: ManagedIdentityCredential
  KEY_VAULT_URL: ${{inputs.key_vault_url}}

# OJO: este comando todavia no tiene script. El plan pide crear
# azureml/src/registrar.py (ver la tabla de cambios al repositorio) y el
# ticket A8 solo cubria los YAML. Mientras tanto este job falla al arrancar,
# y la falla es visible en el grafo, que es preferible a un job en verde que
# no registra nada. Ver el ticket A9 en PROGRESO.md.
command: >-
  export PYTHONPATH=backend/inference:common/sirena-schema &&
  python azureml/src/registrar.py
  --decision ${{inputs.decision}}/decision.json
  --salida ${{outputs.modelo_registrado}}
