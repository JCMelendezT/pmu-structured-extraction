$schema: https://azuremlschemas.azureedge.net/latest/pipelineJob.schema.json
type: pipeline
experiment_name: sirena-evaluacion
display_name: sirena-eval

description: >-
  Valida el corpus versionado, evalua los dos modelos candidatos en paralelo,
  elige uno con la regla del plan y registra la configuracion ganadora.

settings:
  default_compute: azureml:cpu-sirena

inputs:
  # El corpus entra como Data asset versionado, no como codigo: por eso
  # eval-prompt/corpus esta excluido del .amlignore.
  gold:
    path: azureml:gold_v1@latest
    mode: download
  limite: 5
  autor: sirena
  rama: sirena
  key_vault_url: https://mlwsirenkeyvault18607254.vault.azure.net
  # El workspace todavia no existe cuando se escribe el pipeline, asi que estos
  # tres no llevan default: se pasan al crear el job.
  subscription_id: 1ba330a0-5897-4ef6-8fd1-d304b0e766d1
  resource_group: rg-sirena-mp3
  workspace: mlw-sirena

jobs:
  validar:
    display_name: Validar corpus gold
    component: ./components/sirena_validar_corpus.yml
    inputs:
      entrada: ${{parent.inputs.gold}}

  evaluar_20b:
    display_name: Evaluar gpt-oss-20b
    component: ./components/sirena_evaluar_modelo.yml
    identity:
      type: managed
    environment_variables:
      KEY_VAULT_URL: https://mlwsirenkeyvault18607254.vault.azure.net
      INFERENCE_MODELO: openai/gpt-oss-20b
    inputs:
      corpus: ${{parent.jobs.validar.outputs.corpus_validado}}
      modelo: openai/gpt-oss-20b
      limite: ${{parent.inputs.limite}}
      autor: ${{parent.inputs.autor}}
      rama: ${{parent.inputs.rama}}
      key_vault_url: ${{parent.inputs.key_vault_url}}

  evaluar_120b:
    display_name: Evaluar gpt-oss-120b
    component: ./components/sirena_evaluar_modelo.yml
    identity:
      type: managed
    environment_variables:
      KEY_VAULT_URL: https://mlwsirenkeyvault18607254.vault.azure.net
      INFERENCE_MODELO: openai/gpt-oss-120b
    inputs:
      corpus: ${{parent.jobs.validar.outputs.corpus_validado}}
      modelo: openai/gpt-oss-120b
      limite: ${{parent.inputs.limite}}
      autor: ${{parent.inputs.autor}}
      rama: ${{parent.inputs.rama}}
      key_vault_url: ${{parent.inputs.key_vault_url}}

  comparar:
    display_name: Comparar modelos
    component: ./components/sirena_comparar_modelos.yml
    inputs:
      resultados_a: ${{parent.jobs.evaluar_20b.outputs.resultados}}
      resultados_b: ${{parent.jobs.evaluar_120b.outputs.resultados}}

  registrar:
    display_name: Registrar configuracion ganadora
    component: ./components/sirena_registrar_configuracion.yml
    # La identidad va en el job, no en el componente: el esquema del command
    # component no tiene clave identity. Sin esto el job usaria AMLToken, que
    # no tiene permisos de escritura sobre el registro de modelos.
    identity:
      type: managed
    inputs:
      decision: ${{parent.jobs.comparar.outputs.decision}}
      resultados_a: ${{parent.jobs.evaluar_20b.outputs.resultados}}
      resultados_b: ${{parent.jobs.evaluar_120b.outputs.resultados}}
      subscription_id: ${{parent.inputs.subscription_id}}
      resource_group: ${{parent.inputs.resource_group}}
      workspace: ${{parent.inputs.workspace}}
